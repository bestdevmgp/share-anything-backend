<!DOCTYPE html>
<html lang="{{ html_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;word-break:keep-all;overflow-wrap:break-word;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:0 20px;">
<tr>
<td align="center">
<table role="presentation" width="560" cellpadding="0" cellspacing="0">

{% include "partials/header.html" %}

<!-- Body -->
<tr>
<td style="padding:28px 0 24px;">
  <p style="margin:0 0 24px;font-size:13px;color:#a1a1aa;">{{ t.tagline }}</p>
  <h2 style="margin:0 0 8px;font-size:20px;font-weight:600;color:#18181b;">{{ greeting }}</h2>
  <p style="margin:0 0 24px;font-size:14px;line-height:1.7;color:#71717a;">
    {{ t.intro|safe }}
  </p>

  <!-- Service info -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:14px;">
    <tr>
      <td style="padding:14px 16px;background-color:#f8fafc;border-radius:8px;border-left:3px solid #10b981;">
        <p style="margin:0 0 4px;font-size:12px;color:#71717a;">{{ t.service_label }}</p>
        <strong style="color:#18181b;font-size:14px;">{{ service_name }}</strong>
      </td>
    </tr>
  </table>

  <!-- Warning -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
    <tr>
      <td style="padding:14px 16px;background-color:#fffbeb;border-radius:8px;border-left:3px solid #f59e0b;">
        <p style="margin:0;font-size:13px;line-height:1.6;color:#78350f;">
          {{ t.warning|safe }}
        </p>
      </td>
    </tr>
  </table>

  <!-- CTA Button -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <a href="{{ reveal_url }}" style="display:inline-block;padding:10px 28px;background-color:#2563eb;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;border-radius:8px;">
          {{ t.cta }}
        </a>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-top:12px;">
        <p style="margin:0;font-size:12px;color:#a1a1aa;">{{ t.expiry_notice }}</p>
      </td>
    </tr>
  </table>
</td>
</tr>

<!-- Footer -->
<tr>
<td style="padding:24px;background-color:#f4f4f5;margin-top:20px;text-align:center;">
  {% include "partials/footer_links.html" %}
  <p style="margin:0;font-size:12px;color:#a1a1aa;text-align:center;line-height:1.8;">
    {{ t.footer }}<br>
    &copy; ShareAnything
  </p>
</td>
</tr>

</table>
</td>
</tr>
</table>
</body>
</html>
