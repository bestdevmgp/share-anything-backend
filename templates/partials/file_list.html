  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
{% for f in files %}{% if !loop.first %}    <tr><td style="height:6px;"></td></tr>
{% endif %}    <tr>
      <td style="padding:10px 16px;background-color:#f8fafc;border-radius:8px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="padding-right:10px;vertical-align:middle;">
            <span style="display:inline-block;background:{{ f.bg }};color:{{ f.fg }};padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.3px;line-height:18px;">{{ f.label }}</span>
          </td>
          <td>
            <span style="color:#18181b;font-size:14px;font-weight:500;">{{ f.file_name }}</span>
            <span style="color:#a1a1aa;font-size:13px;margin-left:8px;">{{ f.size }}</span>
          </td>
        </tr></table>
      </td>
    </tr>
{% endfor %}  </table>
